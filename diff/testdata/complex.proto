syntax = "proto3";

package nova.diff.testdata;

option go_package = "github.com/2comjie/nova/diff/testdata;testdata";

enum ItemQuality {
  ITEM_QUALITY_UNKNOWN = 0;
  ITEM_QUALITY_COMMON = 1;
  ITEM_QUALITY_RARE = 2;
  ITEM_QUALITY_EPIC = 3;
}

message GameData {
  ScalarValues scalars = 1;
  Profile profile = 2;
  map<uint64, InventoryItem> items = 3;
  map<string, int64> currencies = 4;
  map<int32, bytes> snapshots = 5;
  map<bool, string> feature_flags = 6;
  repeated int64 checkpoints = 7;
  repeated string labels = 8;
  repeated bytes packets = 9;
  repeated InventoryItem lineup = 10;
  repeated ItemQuality qualities = 11;
  WideState wide = 12;
}

message ScalarValues {
  bool enabled = 1;
  ItemQuality quality = 2;
  int32 int32_value = 3;
  sint32 sint32_value = 4;
  sfixed32 sfixed32_value = 5;
  uint32 uint32_value = 6;
  fixed32 fixed32_value = 7;
  int64 int64_value = 8;
  sint64 sint64_value = 9;
  sfixed64 sfixed64_value = 10;
  uint64 uint64_value = 11;
  fixed64 fixed64_value = 12;
  float float_value = 13;
  double double_value = 14;
  string string_value = 15;
  bytes bytes_value = 16;
}

message Profile {
  string nickname = 1;
  Address address = 2;
  repeated string tags = 3;
}

message Address {
  string country = 1;
  string city = 2;
  uint32 zip_code = 3;
}

message InventoryItem {
  uint64 id = 1;
  int32 count = 2;
  ItemQuality quality = 3;
  string name = 4;
  bytes payload = 5;
  ItemAttr attr = 6;
  map<int32, ItemEffect> effects = 7;
  repeated ItemGem gems = 8;
}

message ItemAttr {
  int32 level = 1;
  int32 durability = 2;
}

message ItemEffect {
  int32 id = 1;
  int32 power = 2;
}

message ItemGem {
  int32 id = 1;
  int32 level = 2;
}

message WideState {
  int32 v1 = 1;
  int32 v2 = 2;
  int32 v3 = 3;
  int32 v4 = 4;
  int32 v5 = 5;
  int32 v6 = 6;
