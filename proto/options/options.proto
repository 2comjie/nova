syntax = "proto3";

package wali.options;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/2comjie/wali/pb/pbOptions;pbOptions";

extend google.protobuf.MethodOptions {
  // route_key marks the request field used as the state-routing key.
  //
  // Example:
  //   rpc Kick(KickReq) returns (KickResp) {
  //     option (wali.options.route_key) = "room_id";
  //   }
  string route_key = 51001;
}
