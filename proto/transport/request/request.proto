syntax = "proto3";

package transport.request;

option go_package = "github.com/2comjie/wali/pb/transport/request;pbRequest";

message Request {
  bytes data = 1; // 消息数据
  // 元数据
  string gid = 2;
  string uid = 3;
  int64 cid = 4;
  string ip = 5;
  map<string, string> attrs = 6; // 连接属性
}

message Response {
  bytes data = 1; // data 如果是 空的 就不会写回
}
